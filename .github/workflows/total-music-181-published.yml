name: Published 1.8.0 on a real Android 13

# The reported close-on-startup happened on the APK that is actually published:
# the permanently signed 1.8.0 preview, installed over 1.7.0, on Android 13.
#
# Nothing is rebuilt here. The two release APKs are downloaded by hash and
# treated as evidence, so what this job says is about the exact binaries a user
# would have installed. It runs on its own trigger — a push that touches this
# file or the probe it drives — because it needs no Gradle and answers in ten
# minutes rather than an hour, and because its transcript is the only thing the
# agent can read back: artifacts and job logs are both behind a host the sandbox
# cannot reach, and a pull-request comment is not.
#
# The first run of this job is why the second version of it exists. It started
# the published build in the original player style and it stayed up, which is
# not the style the report came from: both styles are Compose surfaces that are
# not composed at all under Original. So each style is now written into the
# app's own preferences before launch (the emulator image allows `adb root`),
# and each one is launched, killed and relaunched on its own.

on:
  workflow_dispatch:
  push:
    branches: [arena/c83a7b6e-total-music]
    paths:
      - '.github/workflows/total-music-181-published.yml'
      - 'scripts/verify/device_probe.py'

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: total-music-181-published
  cancel-in-progress: true

jobs:
  published:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools emulator system-images;android-33;google_apis;x86_64

      - name: Download the exact signed 1.7.0 and 1.8.0 APKs
        run: |
          set -euo pipefail
          mkdir -p results
          curl -fL --retry 3 https://github.com/Spaceapk/Total-Music/releases/download/v1.7.0/Total-Music-1.7.0-universal.apk -o previous.apk
          curl -fL --retry 3 https://github.com/Spaceapk/Total-Music/releases/download/v1.8.0-preview.1/Total-Music-1.8.0-universal.apk -o published.apk
          echo '2f06be1aca0452d9a19a45195863d7b68a44d4c42be71dc09cb6353236e1bc2c  previous.apk' | sha256sum -c -
          echo '0c757220666a28724c128f40284102c96e6049eb0f8eea121798fb66e90877e3  published.apk' | sha256sum -c -
          {
            echo "== files =="
            ls -l previous.apk published.apk
            for apk in previous.apk published.apk; do
              echo
              echo "== $apk =="
              "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk" 2>&1 | head -3 || true
              "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk" 2>/dev/null | grep -E "native-code|sdkVersion|targetSdkVersion" || true
              "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$apk" 2>&1 | grep -E "certificate (DN|SHA-256)" || echo "not verified"
            done
          } > results/apks.txt 2>&1
          cat results/apks.txt

      - name: Boot Android 13
        run: |
          set -euo pipefail
          mkdir -p results
          { echo "== kvm =="; ls -l /dev/kvm || echo "no /dev/kvm"; sudo chmod a+rw /dev/kvm; } > results/boot.txt 2>&1
          adb start-server >> results/boot.txt 2>&1
          export ANDROID_AVD_HOME="$RUNNER_TEMP/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | avdmanager create avd -n probe -k 'system-images;android-33;google_apis;x86_64' --force >> results/boot.txt 2>&1
          # A 160 MB universal APK plus its extracted native libraries needs more
          # room than the default data partition offers.
          echo "disk.dataPartition.size=6G" >> "$ANDROID_AVD_HOME/probe.avd/config.ini"
          echo "hw.ramSize=3072" >> "$ANDROID_AVD_HOME/probe.avd/config.ini"
          "$ANDROID_HOME/emulator/emulator" -avd probe -no-window -no-audio -no-boot-anim \
            -no-snapshot -no-metrics -gpu swiftshader_indirect -cores 4 -memory 3072 \
            >> results/emulator.log 2>&1 &
          timeout 240 adb wait-for-device >> results/boot.txt 2>&1
          timeout 900 bash -c 'until [ "$(adb shell getprop sys.boot_completed | tr -d "\r")" = 1 ]; do sleep 5; done' >> results/boot.txt 2>&1
          adb shell input keyevent 82 >> results/boot.txt 2>&1
          adb shell getprop > results/device-properties.txt
          echo "booted"
          tail -3 results/boot.txt

      - name: 1.7.0 as installed, then the published 1.8.0 upgraded over it
        run: |
          set -uo pipefail
          mkdir -p results
          PKG=org.nexlibre.totalmusic
          ACT=com.music.bitchord.MainActivity
          {
            echo "\$ adb install -r -g previous.apk"
            timeout 600 adb install --no-streaming -r -g previous.apk 2>&1
            echo "== 1.7.0 launch =="
            adb logcat -c
            adb shell am force-stop $PKG
            timeout 120 adb shell am start -W -n $PKG/$ACT 2>&1
            sleep 20
            echo "pid=[$(adb shell pidof $PKG)]"
            adb logcat -d -b crash -v brief 2>&1 | head -40
            echo "== upgrade to the published 1.8.0 =="
            timeout 600 adb install --no-streaming -r -g published.apk 2>&1
            adb shell dumpsys package $PKG | grep -E "versionCode=|versionName=" | head -2
            adb logcat -c
            adb shell am force-stop $PKG
            timeout 120 adb shell am start -W -n $PKG/$ACT 2>&1
            sleep 20
            echo "pid=[$(adb shell pidof $PKG)]"
            adb logcat -d -b crash -v brief 2>&1 | head -40
            adb shell dumpsys activity exit-info $PKG 2>&1 | head -40
          } > results/published-original.txt 2>&1
          cat results/published-original.txt

      # The two rebirth styles, one at a time, through the probe that the 1.8.1
      # emulator job also uses: it writes the style into the app's preferences,
      # launches, reports the process and any new crash-buffer entry, then opens
      # Settings and comes back.
      - name: The published 1.8.0 in Liquid Glass+
        run: |
          python3 scripts/verify/device_probe.py --apk published.apk --label published-glass \
            --styles LIQUID_GLASS_PLUS --flows settings --tone \
            > results/probe-glass.txt 2>&1 || echo "probe reported failures"
          cat results/probe-glass.txt

      - name: The published 1.8.0 in Google Expressive+
        run: |
          python3 scripts/verify/device_probe.py --apk published.apk --label published-expressive \
            --styles GOOGLE_EXPRESSIVE_PLUS --flows settings --tone \
            > results/probe-expressive.txt 2>&1 || echo "probe reported failures"
          cat results/probe-expressive.txt

      - name: Publish what the emulator saw
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: "5"
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail
          python3 - <<'PY' > results/comment.md
          import os
          def read(name, limit=4500):
              path = os.path.join("results", name)
              if not os.path.isfile(path):
                  return "(missing)"
              try:
                  text = open(path, encoding="utf-8", errors="replace").read().strip()
              except Exception as error:
                  return f"(unreadable: {error})"
              if not text:
                  return "(empty)"
              return text if len(text) <= limit else text[:limit] + "\n… truncated"
          parts = ["### Published 1.8.0 on Android 13 — every style", ""]
          parts.append(f"Run: {os.environ.get('RUN_URL','')}")
          parts.append("")
          parts.append("| Probe | Result |")
          parts.append("| --- | --- |")
          original = read("published-original.txt", 20000)
          parts.append("| 1.7.0, then 1.8.0 updated over it (Original) | "
                       + ("pids reported below" if "pid=[" in original else "no pid line") + " |")
          for name, title in (("probe-glass.txt", "1.8.0 in Liquid Glass+"),
                              ("probe-expressive.txt", "1.8.0 in Google Expressive+")):
              text = read(name, 20000)
              if text == "(missing)":
                  verdict = "did not run"
              elif "crash=yes" in text:
                  verdict = "**crash**"
              elif "DEAD" in text:
                  verdict = "**process died**"
              elif "failures" in text and "- none" not in text:
                  verdict = "failures"
              else:
                  verdict = "stayed up"
              parts.append(f"| {title} | {verdict} |")
          parts.append("")
          for name, title in (("published-original.txt", "1.7.0 then 1.8.0, Original"),
                              ("probe-glass.txt", "1.8.0, Liquid Glass+ (launch, Settings, back)"),
                              ("probe-expressive.txt", "1.8.0, Google Expressive+ (launch, Settings, back)"),
                              ("apks.txt", "the two APKs"),
                              ("boot.txt", "boot")):
              parts += [f"<details><summary>{title}</summary>", "", "```", read(name), "```", "</details>", ""]
          print("\n".join(parts)[:60000])
          PY
          tail -50 results/comment.md
          gh pr comment "$PR_NUMBER" --body-file results/comment.md || echo "could not comment"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: total-music-180-published-device
          path: results/
          retention-days: 30
