name: Total Music 1.8.2 validation

# Favorites & Experience validation. Also runs for the 1.8.3 continuation branch.
# No publishing and no permanent signing credentials. APKs stay explicitly test-only/unsigned.

on:
  # Pushing the 1.8.2 branch is the trigger: `workflow_dispatch` only starts a
  # workflow that already exists on the default branch, and this one is newer
  # than main. Both are listed so the same file can be dispatched by hand once
  # it does reach main.
  push:
    branches: [arena/b3cc8c15-total-music, arena/18b4adc9-total-music]
    # Only a change that can affect the build starts this: an hour of Gradle,
    # lint and two emulators is not worth re-running for a comment or a probe
    # script. The published-APK probe has its own workflow and its own trigger.
    paths:
      - 'app/**'
      - 'shared/**'
      - 'sharedUi/**'
      - 'macrobenchmark/**'
      - 'native/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'total-music-release.properties'
      - 'scripts/release/**'
      - 'scripts/verify/rebirth_check.py'
      - 'scripts/verify/device_probe.py'
      - 'app/src/androidTest/**'
      # This file, so a change to how the build is validated re-runs the
      # validation. Without it the last edit to this workflow was the one push
      # that produced no run at all.
      - '.github/workflows/total-music-182-validate.yml'
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request to report on
        default: "9"
      published_probe:
        description: Reproduce the published 1.8.0 startup crash on an emulator
        type: boolean
        default: true
      device_probe:
        description: Run the 1.8.2 Settings/player round trips on an emulator
        type: boolean
        default: true

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: total-music-182-${{ github.ref }}
  cancel-in-progress: true

env:
  ORG_GRADLE_PROJECT_spaceNdkVersion: '27.0.12077973'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GRADLE_OPTS: '-Dorg.gradle.jvmargs=-Xmx5120m -Dfile.encoding=UTF-8 -Djava.net.preferIPv4Stack=true'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          java-version: '21'
          distribution: temurin
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a

      - name: Install the SDK this project compiles against
        run: |
          sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0' 'cmake;3.22.1' 'ndk;27.0.12077973'
          if [ ! -d "$ANDROID_HOME/platforms/android-37" ]; then ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"; fi

      - name: Compile the whole app
        run: |
          set -o pipefail
          mkdir -p ci-logs
          chmod +x gradlew
          ./gradlew :app:compileProdDebugKotlin --max-workers=2 --build-cache --stacktrace \
            -PspaceSpatialEdition=true 2>&1 | tee ci-logs/compile.log

      # The APKs before the tests, so a failing assertion still leaves something
      # installable behind it.
      #
      # prodMeasurement is the shipped release build — R8 on, non-debuggable —
      # signed with the runner's own debug key so the emulator will take it.
      # That combination is what makes a release-only crash reproducible, and it
      # is why it is built here beside the real, unsigned prodRelease.
      - name: Assemble the debug, release-like probe and release APKs
        run: |
          set -o pipefail
          ./gradlew :app:assembleProdDebug :app:assembleProdMeasurement :app:assembleProdRelease \
            :app:assembleProdDebugAndroidTest \
            --max-workers=2 --build-cache --stacktrace \
            -PspaceSpatialEdition=true -PtotalMusicMeasurementDebugSigning=true \
            2>&1 | tee ci-logs/assemble.log

      - name: Run every unit test in the tree
        id: tests
        continue-on-error: true
        run: |
          set -o pipefail
          ./gradlew :shared:jvmTest :app:testProdDebugUnitTest \
            --max-workers=2 --build-cache --stacktrace -PspaceSpatialEdition=true \
            2>&1 | tee ci-logs/test.log

      - name: Read the unit test results
        if: always()
        run: |
          python3 - <<'PY' > ci-logs/tests-summary.md
          import glob, xml.etree.ElementTree as ET
          rows, failed, total, classes = [], 0, 0, set()
          paths = (glob.glob("app/build/test-results/testProdDebugUnitTest/TEST-*.xml")
                   + glob.glob("shared/build/test-results/jvmTest/TEST-*.xml"))
          for path in sorted(paths):
              try:
                  root = ET.parse(path).getroot()
              except Exception as error:
                  rows.append(f"- could not read {path}: {error}")
                  continue
              for case in root.iter("testcase"):
                  total += 1
                  classes.add(case.get("classname", "?"))
                  problem = case.find("failure")
                  if problem is None:
                      problem = case.find("error")
                  if problem is None:
                      continue
                  failed += 1
                  message = (problem.get("message") or "").strip().splitlines()
                  where = (problem.get("type") or "").strip()
                  rows.append(f"- **{case.get('classname','?').split('.')[-1]} > {case.get('name')}** — {where}")
                  rows += [f"  > {line.strip()[:300]}" for line in message[:4]]
                  body = (problem.text or "").strip().splitlines()
                  rows += [f"  `{line.strip()[:220]}`" for line in body[:6]]
          head = (f"### Unit tests: **{failed} failed** of {total} in {len(classes)} classes"
                  if failed else f"### Unit tests: **{total} passed** in {len(classes)} classes")
          print(head)
          print()
          print("\n".join(rows) if rows else "No failures.")
          PY
          cat ci-logs/tests-summary.md

      - name: Package the APKs with the repository's own verifier
        continue-on-error: true
        run: |
          set -o pipefail
          python3 scripts/release/package_ci.py 2>&1 | tee ci-logs/package.log || true
          ls -l release-artifacts || true

      - name: Record version, version code and signatures
        if: always()
        run: |
          set -uo pipefail
          TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          {
            echo "### Build identity"
            echo
            echo '```'
            grep -E '^(applicationId|versionName|versionCode|certificateSha256|keyAlias)=' total-music-release.properties
            echo '```'
            for apk in $(find app/build/outputs/apk -name '*.apk' | sort); do
              echo
              echo "#### $(basename "$apk")"
              echo
              echo '```'
              "$TOOLS"/aapt dump badging "$apk" 2>/dev/null | head -1
              sha256sum "$apk"
              if "$TOOLS"/apksigner verify "$apk" >/dev/null 2>&1; then
                "$TOOLS"/apksigner verify --print-certs "$apk" 2>/dev/null | grep -E 'certificate (DN|SHA-256 digest)'
              else
                echo "NOT SIGNED — the release build waiting for the permanent key."
              fi
              echo '```'
            done
            echo
            echo "Only an APK whose certificate SHA-256 is the permanent one named above can update an"
            echo "installed Total Music. Neither the debug nor the release-like probe APK carries it;"
            echo "they are test builds, and the permanent keystore is not available to CI."
          } > ci-logs/apk-signature.txt
          cat ci-logs/apk-signature.txt

      - name: Name the artifacts this run produces
        if: always()
        run: |
          set -uo pipefail
          mkdir -p ci-logs/apks
          for apk in $(find app/build/outputs/apk -name '*.apk' | sort); do
            # Keep the flavour and the build type in the file name: "prod",
            # "measurement", "debug" and "release" have to stay distinguishable
            # in a download folder, not just inside Gradle's directory tree.
            flavour=$(basename "$(dirname "$(dirname "$apk")")")
            build_type=$(basename "$(dirname "$apk")")
            cp "$apk" "ci-logs/apks/${flavour}-${build_type}-$(basename "$apk")"
          done
          cp ci-logs/apk-signature.txt ci-logs/apks/ 2>/dev/null || true
          ls -l ci-logs/apks | head -20

      # Two deliverables, kept apart on purpose.
      #
      # The release APK is the one a permanent key would sign, and it is the
      # only file that can ever become an update. The test APK is installable
      # but cannot replace an installed Total Music, because it carries the
      # runner's throwaway debug certificate. Putting them in one artifact
      # invites exactly the mistake that matters — installing the test build
      # over a real installation — so each gets its own name, its own checksums
      # and a text file that says what it is on the download page itself.
      - name: Stage the unsigned release APK and the test APK separately
        if: always()
        run: |
          set -uo pipefail
          rm -rf delivery
          mkdir -p delivery/unsigned-release delivery/test-apk
          TOOLS="$ANDROID_HOME/build-tools/36.0.0"

          release=$(find app/build/outputs/apk/prod/release -name '*universal*release-unsigned.apk' 2>/dev/null | head -1)
          if [ -n "${release:-}" ]; then
            cp "$release" delivery/unsigned-release/
            ( cd delivery/unsigned-release && sha256sum ./*.apk > SHA256SUMS )
            {
              echo "Total Music 1.8.2 — release APK"
              echo
              echo "NOT SIGNED. This is the build that waits for the permanent"
              echo "signing key; it cannot be installed as an update over an"
              echo "existing Total Music until it is signed with that key."
              echo
              echo "package:      $("$TOOLS"/aapt dump badging "$release" 2>/dev/null | head -1 | sed -E "s/.*name='([^']+)' versionCode='([^']+)' versionName='([^']+)'.*/\1 \2 \3/")"
              echo "certificate:  none"
              echo "expected:     9ae145a703a85902fe6d6ab3d886f6801873d717929deaa3e3d0b0a81de829fa"
              echo "              (the certificate of the published 1.7.0 and 1.8.0)"
              echo
              echo "To make it an update, sign it outside CI with that keystore:"
              echo "  python3 scripts/release/sign_apk.py <this file> dist \\"
              echo "    --previous-apk Total-Music-1.8.0-universal.apk"
              echo "and keep TOTAL_MUSIC_KEYSTORE / TOTAL_MUSIC_PASSWORD_FILE outside"
              echo "the checkout, as that script requires."
            } > delivery/unsigned-release/SIGNING-STATUS.txt
            cat delivery/unsigned-release/SIGNING-STATUS.txt
          else
            echo "no universal release APK was produced" > delivery/unsigned-release/MISSING.txt
          fi

          for apk in $(find app/build/outputs/apk/prod/debug -name '*universal*debug.apk' 2>/dev/null | head -1) \
                     $(find app/build/outputs/apk/prod/measurement -name '*universal*measurement.apk' 2>/dev/null | head -1); do
            cp "$apk" delivery/test-apk/
          done
          cp ci-logs/apk-signature.txt delivery/test-apk/ 2>/dev/null || true
          ( cd delivery/test-apk && sha256sum ./*.apk > SHA256SUMS )
          {
            echo "Total Music 1.8.2 — TEST build, do not ship"
            echo
            echo "Signed with the CI runner's throwaway Android debug certificate."
            echo "It installs on a clean device and cannot be installed over a"
            echo "published Total Music, and no future update can be signed with"
            echo "the same key because that key is deleted with the runner."
            echo
            echo "Its purpose is to exercise the app: the rebirth shell on a real"
            echo "Android 13, in both styles, and the R8 build (measurement) with"
            echo "the shipped package name."
          } > delivery/test-apk/TEST-ONLY.txt
          cat delivery/test-apk/TEST-ONLY.txt
          ls -l delivery/unsigned-release delivery/test-apk

          # The comment quotes this, so the two downloads are named with their
          # hashes in the place a reader looks first.
          {
            echo "### Deliverables"
            echo
            echo "Artifact \`total-music-182-release-unsigned\` — the release APK. **Not signed.**"
            echo
            echo '```'
            ( cd delivery/unsigned-release && sha256sum ./*.apk 2>/dev/null || echo "(no release APK)" )
            echo '```'
            echo
            echo "Artifact \`total-music-182-test-apk\` — installable test builds, debug certificate."
            echo
            echo '```'
            ( cd delivery/test-apk && sha256sum ./*.apk 2>/dev/null || echo "(no test APK)" )
            echo '```'
          } > ci-logs/delivery-manifest.md
          cat ci-logs/delivery-manifest.md

      - name: Hand over the unsigned release APK
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: total-music-182-release-unsigned
          path: delivery/unsigned-release/
          if-no-files-found: error
          retention-days: 30

      - name: Hand over the test APK
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: total-music-182-test-apk
          path: delivery/test-apk/
          if-no-files-found: warn
          retention-days: 30

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: total-music-182-apks
          path: |
            ci-logs/apks/
            ci-logs/tests-summary.md
            ci-logs/apk-signature.txt
          if-no-files-found: warn
          retention-days: 30

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: total-music-182-logs
          path: ci-logs/
          if-no-files-found: warn
          retention-days: 14

      - name: Report the build on the pull request
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || (github.ref == 'refs/heads/arena/18b4adc9-total-music' && '10') || inputs.pr || '0' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -uo pipefail
          python3 - "$JOB_STATUS" "$RUN_URL" <<'PY' > ci-logs/comment.md
          import os, re, sys
          status, run_url = sys.argv[1], sys.argv[2]
          starts = re.compile(r"^(e: |FAILURE:|What went wrong|Caused by:|> Task .*FAILED|FAILED$|AssertionError|org\.gradle)")
          parts = [f"### 1.8.2 build: **{status}**", "", f"Run: {run_url}", ""]
          for name in ("tests-summary.md", "delivery-manifest.md", "apk-signature.txt"):
              path = f"ci-logs/{name}"
              if os.path.isfile(path):
                  parts += [open(path, encoding="utf-8").read(), ""]
          for name in ("compile", "assemble", "test", "package"):
              path = f"ci-logs/{name}.log"
              if not os.path.isfile(path):
                  continue
              lines = open(path, encoding="utf-8", errors="replace").read().splitlines()
              hits, index = [], 0
              while index < len(lines) and len(hits) < 80:
                  if starts.search(lines[index]):
                      hits.append(lines[index])
                      for extra in lines[index + 1:index + 4]:
                          if extra.startswith((" ", "\t")):
                              hits.append(extra)
                          else:
                              break
                  index += 1
              if not hits:
                  continue
              marker = ("step succeeded; matches below did not fail the build"
                        if status == "success" else name)
              parts += [f"<details><summary>{marker} — {name}.log, {len(lines)} lines</summary>", "", "```"]
              parts += hits
              parts += ["```", "</details>", ""]
          body = "\n".join(parts)
          if len(body) > 60000:
              body = body[:60000] + "\n… truncated"
          sys.stdout.write(body)
          PY
          if [ "$PR_NUMBER" != "0" ]; then gh pr comment "$PR_NUMBER" --body-file ci-logs/comment.md || echo "could not comment"; fi

      - name: Fail when the unit tests failed
        if: steps.tests.outcome == 'failure'
        run: |
          echo "Unit tests failed; see the run's comment and ci-logs/tests-summary.md."
          exit 1

  lint:
    # Its own runner on purpose. 1.8.0's lint was killed when the build job ran
    # out of memory at the same time as the tests, which left lint with no
    # verdict at all; here it gets the machine to itself, one Gradle worker and
    # an explicit heap, and its outcome is reported either way.
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          java-version: '21'
          distribution: temurin
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
      - name: Install the SDK this project compiles against
        run: |
          sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0' 'cmake;3.22.1' 'ndk;27.0.12077973'
          if [ ! -d "$ANDROID_HOME/platforms/android-37" ]; then ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"; fi
      - name: Say what the runner has to work with
        run: |
          free -m || true
          df -h . || true
          java -version || true
      - name: Android lint
        id: lint
        continue-on-error: true
        run: |
          set -o pipefail
          mkdir -p ci-logs
          chmod +x gradlew
          ./gradlew :app:lintProdDebug \
            -Dorg.gradle.jvmargs='-Xmx4096m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8' \
            --max-workers=1 --no-daemon --stacktrace -PspaceSpatialEdition=true \
            2>&1 | tee ci-logs/lint.log
      - name: Summarise the lint report
        if: always()
        run: |
          python3 - <<'PY' > ci-logs/lint-summary.md
          import glob, xml.etree.ElementTree as ET
          reports = sorted(glob.glob("app/build/reports/lint-results-*.xml"))
          if not reports:
              print("### Android lint: **no report produced**")
              print()
              print("Gradle did not get as far as writing a lint result. The log below says why;")
              print("an out-of-memory kill and a lint finding look nothing alike there.")
              raise SystemExit(0)
          for report in reports:
              root = ET.parse(report).getroot()
              issues = root.findall("issue")
              errors = [i for i in issues if i.get("severity") in ("Error", "Fatal")]
              warnings = [i for i in issues if i.get("severity") == "Warning"]
              print(f"### Android lint ({report}): **{len(errors)} errors**, {len(warnings)} warnings")
              print()
              for issue in errors[:40]:
                  where = issue.find("location")
                  place = f"{where.get('file')}:{where.get('line')}" if where is not None else "?"
                  print(f"- **{issue.get('id')}** — {issue.get('message')}")
                  print(f"  `{place}`")
          PY
          cat ci-logs/lint-summary.md
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: total-music-182-lint
          path: |
            ci-logs/lint.log
            ci-logs/lint-summary.md
            app/build/reports/lint-results-*.xml
            app/build/reports/lint-results-*.html
          if-no-files-found: warn
          retention-days: 30
      - name: Report lint on the pull request
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || (github.ref == 'refs/heads/arena/18b4adc9-total-music' && '10') || inputs.pr || '0' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          LINT_OUTCOME: ${{ steps.lint.outcome }}
        run: |
          set -uo pipefail
          {
            echo "### Lint: **${LINT_OUTCOME}**"
            echo
            echo "Run: ${RUN_URL}"
            echo
            cat ci-logs/lint-summary.md 2>/dev/null || echo "no summary"
            echo
            if [ "${LINT_OUTCOME}" != "success" ]; then
              echo "<details><summary>lint.log tail</summary>"
              echo
              echo '```'
              grep -E '^(e: |FAILURE|Caused by:|> Task .*FAILED|Exception|OutOfMemory|java\.lang)' ci-logs/lint.log 2>/dev/null | head -40 || tail -40 ci-logs/lint.log
              echo '```'
              echo "</details>"
            fi
          } > ci-logs/lint-comment.md
          if [ "$PR_NUMBER" != "0" ]; then gh pr comment "$PR_NUMBER" --body-file ci-logs/lint-comment.md || echo "could not comment"; fi

  device:
    # The 1.8.2 candidate, doing the two things that were reported broken.
    if: ${{ always() && (github.event_name == 'push' || inputs.device_probe) && needs.build.result != 'cancelled' && needs.build.result != 'skipped' }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools emulator system-images;android-33;google_apis;x86_64
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: total-music-182-apks
          path: apks
      - name: List what arrived
        run: find apks -type f | head -20
      - name: Publish instrumented compile errors
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f ui-compile.log ]; then
            { echo '### Instrumented compile errors'; echo '```'; grep -E '^e: |FAILED|What went wrong|Caused by:|Unresolved' ui-compile.log | head -100 || true; echo '```'; } > ui-compile-comment.md
            gh api repos/${{ github.repository }}/issues/10/comments -F body=@ui-compile-comment.md || true
          fi

      - name: Boot Android 13
        run: |
          set -euo pipefail
          sudo chmod a+rw /dev/kvm || { echo "no /dev/kvm on this runner"; exit 1; }
          adb start-server >/dev/null
          export ANDROID_AVD_HOME="$RUNNER_TEMP/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | avdmanager create avd -n probe -k 'system-images;android-33;google_apis;x86_64' --force
          "$ANDROID_HOME/emulator/emulator" -avd probe -no-window -no-audio -no-boot-anim \
            -no-snapshot -no-metrics -gpu swiftshader_indirect -cores 2 -memory 2048 \
            > emulator.log 2>&1 &
          timeout 240 adb wait-for-device
          timeout 900 bash -c 'until [ "$(adb shell getprop sys.boot_completed | tr -d "\r")" = 1 ]; do sleep 5; done'
          adb shell input keyevent 82
          adb shell getprop > device-properties.txt
          echo "booted"
      - name: Probe the release-like build (R8, shipped package)
        continue-on-error: true
        run: |
          set -uo pipefail
          # The universal APK: this emulator is x86_64, and the per-ABI APKs
          # would install on nothing here. It is the only one of the four that
          # carries every ABI.
          APK=$(find apks -name '*universal*measurement*.apk' | head -1)
          echo "APK: $APK"
          python3 scripts/verify/device_probe.py --apk "$APK" --label release-like \
            --styles LIQUID_GLASS_PLUS,GOOGLE_EXPRESSIVE_PLUS --flows settings,player,categories \
            --tone --screenshots screenshots > probe-release-like.log 2>&1 || echo "probe reported failures"
          tail -80 probe-release-like.log
      - name: Probe the debug build in both rebirth styles
        continue-on-error: true
        run: |
          set -uo pipefail
          APK=$(find apks -name '*universal*debug.apk' | head -1)
          echo "APK: $APK"
          # prodDebug uses the shipped package; only the dedicated benchmark
          # variant carries a .debug suffix (see app/build.gradle.kts).
          python3 scripts/verify/device_probe.py --apk "$APK" --label debug \
            --package org.nexlibre.totalmusic \
            --styles LIQUID_GLASS_PLUS,GOOGLE_EXPRESSIVE_PLUS --flows categories,settings,player,reopen \
            --tone --screenshots screenshots > probe-debug.log 2>&1 || echo "probe reported failures"
          tail -80 probe-debug.log
      - name: Publish what the emulator saw
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || (github.ref == 'refs/heads/arena/18b4adc9-total-music' && '10') || inputs.pr || '0' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail
          python3 - <<'PY' > device-comment.md
          import os
          parts = ["### 1.8.2 on Android 13", "", f"Run: {os.environ.get('RUN_URL','')}", ""]
          for name, title in (("probe-release-like.log", "release-like (R8, non-debuggable)"),
                              ("probe-debug.log", "debug (both rebirth styles)")):
              if not os.path.isfile(name):
                  parts += [f"#### {title}", "", "(the probe never ran)", ""]
                  continue
              text = open(name, encoding="utf-8", errors="replace").read()
              lines = text.splitlines()
              # The verdict first: the notes and the failure list are what the
              # reader needs, and the step-by-step headings are evidence for it.
              verdict, inside = [], False
              for line in lines:
                  if line.startswith("== notes") or line.startswith("== failures"):
                      inside = True
                  if inside:
                      verdict.append(line)
              # The whole transcript, not a filtered view of it: the previous
              # version dropped the probe's own notes and the traceback the
              # emulator reports when a step dies half way, which left a
              # successful-looking summary with no verdict in it.
              keep = lines[:160]
              if len(lines) > len(keep):
                  keep = keep + [f"… {len(lines) - len(keep)} more lines in the artifact"]
              parts += [f"<details><summary>{title}</summary>", ""]
              if verdict:
                  parts += ["**Verdict**", "", "```", *verdict[:40], "```", ""]
              parts += ["**Steps**", "", "```", *keep, "```", "</details>", ""]
          print("\n".join(parts)[:60000])
          PY
          tail -40 device-comment.md
          if [ "$PR_NUMBER" != "0" ]; then gh pr comment "$PR_NUMBER" --body-file device-comment.md || echo "could not comment"; fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: total-music-182-device
          path: |
            probe-*.log
            device-properties.txt
            emulator.log
          if-no-files-found: warn
          retention-days: 30

      - name: Hand over the real screen captures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: total-music-182-screenshots
          path: screenshots/
          if-no-files-found: warn
          retention-days: 30

  ui:
    # The crash this release fixes was native: RenderThread walking a render
    # tree that contained itself. No JVM test can see it — there is no
    # RenderThread and no RenderNode — and a tap-driven probe can only report
    # that the process was already gone. So the shell is composed and drawn by a
    # Compose UI test on a real emulator, and the redraw after Settings is part
    # of the test rather than an aside.
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GRADLE_OPTS: '-Dorg.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          java-version: '21'
          distribution: temurin
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools emulator system-images;android-33;google_apis;x86_64
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a

      - name: Install the SDK this project compiles against
        run: |
          sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0' 'cmake;3.22.1' 'ndk;27.0.12077973'
          if [ ! -d "$ANDROID_HOME/platforms/android-37" ]; then ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"; fi

      - name: Compile instrumented APKs before allocating emulator memory
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:assembleProdDebug :app:assembleProdDebugAndroidTest \
            -PspaceSpatialEdition=true -Pandroid.injected.build.abi=x86_64 \
            --max-workers=2 --build-cache --stacktrace 2>&1 | tee ui-compile.log
          # Preserve APKs before the connected-test plugin's cleanup phase.
          python3 - <<'PYCACHE'
          import os, pathlib, shutil
          target = pathlib.Path(os.environ['RUNNER_TEMP']) / 'ui-apks'
          target.mkdir(exist_ok=True)
          for apk in pathlib.Path('app').rglob('*.apk'):
              shutil.copy2(apk, target / apk.name)
          print('Cached UI APKs:', [p.name for p in target.glob('*.apk')])
          PYCACHE
          # Do not retain the compiler heap while Android and the playback service run.
          ./gradlew --stop

      - name: Boot Android 13
        run: |
          set -euo pipefail
          sudo chmod a+rw /dev/kvm || { echo "no /dev/kvm on this runner"; exit 1; }
          adb start-server >/dev/null
          export ANDROID_AVD_HOME="$RUNNER_TEMP/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | avdmanager create avd -n ui -k 'system-images;android-33;google_apis;x86_64' --force
          echo "disk.dataPartition.size=6G" >> "$ANDROID_AVD_HOME/ui.avd/config.ini"
          echo "hw.ramSize=2048" >> "$ANDROID_AVD_HOME/ui.avd/config.ini"
          "$ANDROID_HOME/emulator/emulator" -avd ui -no-window -no-audio -no-boot-anim \
            -no-snapshot -no-metrics -gpu swiftshader_indirect -cores 2 -memory 2048 \
            > emulator-ui.log 2>&1 &
          timeout 300 adb wait-for-device
          timeout 900 bash -c 'until [ "$(adb shell getprop sys.boot_completed | tr -d "\r")" = 1 ]; do sleep 5; done'
          adb shell input keyevent 82
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          adb devices
          echo "booted"

      - name: Test favorites navigation and playlists on Android
        id: uitest
        continue-on-error: true
        run: |
          set -o pipefail
          chmod +x gradlew
          # One ABI: the emulator is x86_64, and building the other three native
          # ABIs would add minutes to prove nothing.
          ./gradlew :app:connectedProdDebugAndroidTest \
            '-Dorg.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8' \
            -Pandroid.injected.androidTest.leaveApksInstalledAfterRun=true \
            -PspaceSpatialEdition=true \
            -Pandroid.injected.build.abi=x86_64 \
            '-Pandroid.testInstrumentationRunnerArguments.class=com.music.bitchord.RebirthGlassShellUiTest,com.music.bitchord.DeviceFavoriteStoreTest,com.music.bitchord.RebirthNavigationStateTest,com.music.bitchord.FavoritePlayerUiTest,com.music.bitchord.AppearanceThemeUiTest,com.music.bitchord.FavoritePlaybackJourneyTest,com.music.bitchord.FavoriteCatalogUiTest,com.music.bitchord.TotalEqStudioUiTest,com.music.bitchord.DevicePlaylistStoreTest' \
            --max-workers=2 --build-cache --stacktrace 2>&1 | tee ui-test.log

      - name: Verify favorites and appearance after a real process restart
        if: steps.uitest.outcome == 'success'
        run: |
          set -euo pipefail
          exec > >(tee process-restart-setup.log) 2>&1
          ./gradlew --stop
          # Injected-ABI builds may use a plain prod-debug name, not an ABI split.
          # Instrumentation APKs are testOnly and explicitly require adb install -t.
          python3 - <<'PYINSTALL'
          import os, pathlib, subprocess
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'ui-apks'
          candidates = sorted(root.glob('*.apk'))
          print('Cached APKs:', [str(p) for p in candidates], flush=True)
          for package, is_test in [('org.nexlibre.totalmusic', False), ('org.nexlibre.totalmusic.test', True)]:
              installed = subprocess.run(['adb', 'shell', 'pm', 'path', package], capture_output=True, text=True).stdout
              print(package + ': ' + installed.strip(), flush=True)
              if 'package:' in installed:
                  continue
              eligible = [p for p in candidates if ('androidTest' in p.name) == is_test and
                  (is_test or 'x86_64' in p.name or 'universal' in p.name or p.name == 'app-prod-debug.apk')]
              if not eligible:
                  raise SystemExit('No installed package or cached APK for ' + package)
              subprocess.run(['adb', 'install', '-r', '-t', str(eligible[0])], check=True)
          PYINSTALL
          python3 - <<'PYRESTART'
          import pathlib, re, subprocess
          logs = []
          for method in ('aWriteBeforeProcessDeath', 'bReadInNewProcessAndCleanUp'):
              subprocess.run(['adb', 'shell', 'am', 'force-stop', 'org.nexlibre.totalmusic'], check=True)
              result = subprocess.run(['adb', 'shell', 'am', 'instrument', '-w', '-r', '-e', 'class',
                  'com.music.bitchord.FavoriteProcessRestartTest#' + method,
                  'org.nexlibre.totalmusic.test/androidx.test.runner.AndroidJUnitRunner'],
                  capture_output=True, text=True, timeout=120)
              logs.append(method + '\n' + result.stdout + result.stderr)
              pathlib.Path('process-restart.log').write_text('\n'.join(logs))
              print(logs[-1])
              if result.returncode or not re.search(r'OK \(1 test\)', result.stdout):
                  raise SystemExit('Process-restart assertion failed; see process-restart.log')
          PYRESTART

      - name: Exercise large-queue recreation in an isolated instrumentation process
        id: stress
        if: steps.uitest.outcome == 'success'
        continue-on-error: true
        run: |
          python3 - <<'PYSTRESS'
          import pathlib, re, subprocess
          subprocess.run(['adb', 'shell', 'am', 'force-stop', 'org.nexlibre.totalmusic'], check=True)
          result = subprocess.run(['adb', 'shell', 'am', 'instrument', '-w', '-r', '-e', 'class',
              'com.music.bitchord.LocalPlaybackServiceTest#largeLocalQueueSurvivesPlaybackAndActivityRecreation',
              'org.nexlibre.totalmusic.test/androidx.test.runner.AndroidJUnitRunner'],
              capture_output=True, text=True, timeout=180)
          pathlib.Path('large-queue.log').write_text(result.stdout + result.stderr)
          print(result.stdout + result.stderr)
          if result.returncode or not re.search(r'OK \(1 test\)', result.stdout):
              raise SystemExit('Isolated large-queue regression failed; see large-queue.log')
          PYSTRESS

      - name: Collect player visual previews
        if: always()
        run: |
          mkdir -p player-previews
          adb exec-out run-as org.nexlibre.totalmusic tar -cf - files/player-previews > player-previews.tar || true
          tar -xf player-previews.tar -C player-previews --strip-components=2 || true

      - name: Read the UI test results
        if: always()
        run: |
          python3 - <<'PY' > ui-test-summary.md
          import glob, xml.etree.ElementTree as ET
          rows, total, failed = [], 0, 0
          for path in sorted(glob.glob("app/build/outputs/androidTest-results/connected/**/*.xml", recursive=True)):
              try:
                  root = ET.parse(path).getroot()
              except Exception as error:
                  rows.append(f"- could not read {path}: {error}")
                  continue
              for case in root.iter("testcase"):
                  total += 1
                  problem = case.find("failure")
                  if problem is None:
                      problem = case.find("error")
                  name = f"{case.get('classname','?').split('.')[-1]} > {case.get('name')}"
                  if problem is None:
                      rows.append(f"- passed: {name}")
                      continue
                  failed += 1
                  rows.append(f"- **failed: {name}**")
                  body = (problem.text or "").strip().splitlines()
                  rows += [f"  `{line.strip()[:200]}`" for line in body[:6]]
          if failed:
              print(f"### Rebirth shell UI test: **{failed} failed** of {total}")
          elif total:
              print(f"### Rebirth shell UI test: **{total} passed**")
          else:
              print("### Rebirth shell UI test: **no result**")
          print()
          print("\n".join(rows) if rows else "No report was written; see the log.")
          PY
          cat ui-test-summary.md

      - name: Report the UI test on the pull request
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || (github.ref == 'refs/heads/arena/18b4adc9-total-music' && '10') || inputs.pr || '0' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          OUTCOME: ${{ steps.uitest.outcome }}
        run: |
          set -uo pipefail
          {
            echo "Run: ${RUN_URL}"
            echo
            cat ui-test-summary.md 2>/dev/null || echo "no summary"
            if [ -f process-restart-setup.log ]; then
              echo '<details><summary>Process restart setup</summary>'
              echo '```'
              tail -60 process-restart-setup.log
              echo '```'
              echo '</details>'
            fi
            if [ -f process-restart.log ]; then
              echo '<details><summary>Process restart assertions</summary>'
              echo '```'
              cat process-restart.log
              echo '```'
              echo '</details>'
            fi
            if [ -f large-queue.log ]; then
              echo '<details><summary>Isolated large-queue regression</summary>'
              echo '```'
              tail -80 large-queue.log
              echo '```'
              echo '</details>'
            fi
            if [ -f ui-compile.log ]; then
              echo
              echo '<details><summary>ui-compile.log, errors</summary>'
              echo '```'
              grep -E '^(e: |w: .*androidTest)|FAILED|What went wrong|Caused by:|Unresolved' ui-compile.log | head -80 || true
              echo '```'
              echo '</details>'
            fi
            if [ "${OUTCOME}" != "success" ]; then
              echo
              echo "<details><summary>ui-test.log, interesting lines</summary>"
              echo
              echo '```'
              grep -E '^(e: |w: .*androidTest)|FAILED|AssertionError|Process crashed|INSTRUMENTATION|not found|No connected devices|Exception|What went wrong|Caused by:' ui-test.log 2>/dev/null | head -60 || tail -60 ui-test.log
              echo '```'
              echo "</details>"
            fi
          } > ui-test-comment.md
          if [ "$PR_NUMBER" != "0" ]; then gh pr comment "$PR_NUMBER" --body-file ui-test-comment.md || echo "could not comment"; fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: total-music-182-uitest
          path: |
            ui-test.log
            ui-compile.log
            ui-test-summary.md
            process-restart.log
            process-restart-setup.log
            large-queue.log
            app/build/outputs/androidTest-results/
            app/build/reports/androidTests/
            emulator-ui.log
            player-previews/
          if-no-files-found: warn
          retention-days: 30

      - name: Fail when the UI test failed
        if: steps.uitest.outcome != 'success' || steps.stress.outcome != 'success'
        run: |
          echo "The rebirth shell UI test did not pass; see the comment and ui-test-summary.md."
          exit 1
