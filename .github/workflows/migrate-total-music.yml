name: Verify Total Music migration
on:
  push:
    paths: ['.github/workflows/migrate-total-music.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify-migration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Verify history and unchanged application code
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 25913a24fe12d23e1beb3b87a4bd8a172c914482 HEAD
          git diff --exit-code 25913a24fe12d23e1beb3b87a4bd8a172c914482 HEAD -- app shared sharedUi native backend desktopApp gradle scripts total-music-release.properties build.gradle.kts settings.gradle.kts gradle.properties
          python3 scripts/release/check_release.py
      - name: Finalize maintenance documentation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('docs/TOTAL_MUSIC_RELEASES.md')
          text = p.read_text().replace('design/total-music-1.2.0', 'main').replace('prepare_version.py 1.0.3', 'prepare_version.py 1.2.1')
          p.write_text(text)
          PY
          git config user.name Spaceapk
          git config user.email 345450721+Spaceapk@users.noreply.github.com
          git add docs/TOTAL_MUSIC_RELEASES.md
          if ! git diff --cached --quiet; then
            git commit -m 'Finalize Total Music maintenance on main'
            git push origin HEAD:main
          fi
