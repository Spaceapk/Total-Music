name: Retrieve exact signed Total Music 1.5.0 reference
on:
  push:
    branches: [work/total-music-1.6.0-tools]
    paths: [.github/workflows/total-music-160-reference.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  retrieve-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download original 1.5.0 APK from existing draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p reference
          gh api repos/Spaceapk/Total-Music/releases > "$RUNNER_TEMP/releases.json"
          asset_id=$(python3 - "$RUNNER_TEMP/releases.json" <<'PY'
          import json,sys
          releases=json.load(open(sys.argv[1]))
          assets=[a for r in releases for a in r.get('assets',[]) if a['name']=='Total-Music-1.5.0-universal.apk']
          assert len(assets)==1, 'Expected one exact 1.5.0 reference'
          print(assets[0]['id'])
          PY
          )
          gh api -H 'Accept: application/octet-stream' "repos/Spaceapk/Total-Music/releases/assets/$asset_id" > reference/Total-Music-1.5.0-universal.apk
          echo 'a49e746446a8e8a010b269f0af8fb5d68ef1eb2b9764f9ba6b009e998fda0208  reference/Total-Music-1.5.0-universal.apk' | sha256sum -c -
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: total-music-original-signed-150-reference
          path: reference/
          if-no-files-found: error
          retention-days: 7
