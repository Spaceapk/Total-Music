          python3 - <<'PY_APPLY'
          import base64, hashlib, os, pathlib, subprocess
          if os.environ['GITHUB_REPOSITORY'] != 'Spaceapk/Total-Music':
              raise SystemExit('This update is scoped to Spaceapk/Total-Music')
          for data_key, hash_key, filename in (
              ('TOTAL_MUSIC_PATCH_B64', 'TOTAL_MUSIC_PATCH_SHA256', 'total-music-140.patch'),
              ('TOTAL_MUSIC_LOCALE_B64', 'TOTAL_MUSIC_LOCALE_SHA256', 'total-music-140-locales.patch'),
          ):
              raw = base64.b64decode(os.environ[data_key])
              if hashlib.sha256(raw).hexdigest() != os.environ[hash_key]:
                  raise SystemExit('Embedded patch checksum failed: ' + filename)
              patch = pathlib.Path(os.environ['RUNNER_TEMP']) / filename
              patch.write_bytes(raw)
              if subprocess.run(['git', 'apply', '--reverse', '--check', str(patch)], capture_output=True).returncode == 0:
                  print('Patch already applied: ' + filename)
              else:
                  subprocess.run(['git', 'apply', '--check', str(patch)], check=True)
                  subprocess.run(['git', 'apply', str(patch)], check=True)
          PY_APPLY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CHANGELOG.md app/src sharedUi/src/jvmSharedMain/kotlin/com/music/bitchord/ui/theme/ArtworkPalette.kt total-music-release.properties docs/verification-1.4.0.md
          if ! git diff --cached --quiet; then
            git diff --cached --check
            git commit -m 'Apply Total Music 1.4.0 adaptive glass and artwork colors (verification pending)'
            git push origin HEAD:main
          fi
          git rev-parse HEAD
