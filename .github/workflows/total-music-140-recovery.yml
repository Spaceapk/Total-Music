      - name: Build test APK and optimized unsigned release
        run: ./gradlew '-Dorg.gradle.jvmargs=-Xmx6144m -Dfile.encoding=UTF-8' --max-workers=2 :app:assembleProdDebug :app:assembleProdRelease -PspaceSpatialEdition=true --build-cache --stacktrace
