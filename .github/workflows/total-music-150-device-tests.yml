name: Total Music 1.5.0 Android UI regression
on:
  workflow_dispatch:
  workflow_run:
    workflows: ['Total Music Android verification']
    types: [completed]
    branches: [main]
permissions:
  contents: read
jobs:
  android-ui:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ORG_GRADLE_PROJECT_spaceNdkVersion: '27.0.12077973'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          java-version: '21'
          distribution: temurin
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools emulator system-images;android-33;google_apis;x86_64
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
      - name: Install build tools
        run: |
          sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0' 'cmake;3.22.1' 'ndk;27.0.12077973'
          if [ ! -d "$ANDROID_HOME/platforms/android-37" ]; then ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"; fi
      - name: Run album, selection and playlist regression on Android 13
        run: |
          set -euo pipefail
          mkdir -p device-results
          adb start-server
          sudo chmod a+rw /dev/kvm
          export ANDROID_AVD_HOME="$RUNNER_TEMP/total-music-150-avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | avdmanager create avd -n totalmusic150 -k 'system-images;android-33;google_apis;x86_64' --force
          "$ANDROID_HOME/emulator/emulator" -avd totalmusic150 -no-window -no-audio -no-boot-anim -no-snapshot -no-metrics -gpu swiftshader_indirect -feature -Vulkan -cores 2 -memory 2048 > device-results/emulator.log 2>&1 &
          timeout 120 adb wait-for-device
          timeout 300 bash -c 'until [ "$(adb shell getprop sys.boot_completed | tr -d "\r")" = 1 ]; do sleep 2; done'
          adb shell input keyevent 82
          adb logcat -v threadtime > device-results/logcat.txt 2>&1 &
          chmod +x gradlew
          ./gradlew '-Dorg.gradle.jvmargs=-Xmx6144m -Dfile.encoding=UTF-8' --max-workers=2 :app:connectedProdDebugAndroidTest -PspaceSpatialEdition=true '-Pandroid.testInstrumentationRunnerArguments.class=com.music.bitchord.AlbumTrackOrderUiTest,com.music.bitchord.DevicePlaylistStoreTest' --build-cache --stacktrace
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: total-music-150-android-ui-${{ github.event.workflow_run.head_sha || github.sha }}
          path: |
            device-results/
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          retention-days: 14
