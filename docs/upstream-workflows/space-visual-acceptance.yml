name: Review rendered Space Music library and settings themes
on:
  push:
    branches: [space-reviewed-publication]
    paths: ['.github/workflows/space-visual-acceptance.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 26
            screen: 320x640
          - api: 33
            screen: 360x800
          - api: 35
            screen: 412x892
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require unchanged production source and accepted signed APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api repos/$GITHUB_REPOSITORY/actions/runs/38738002276 --jq .head_sha)" = 328dc2e1caf84d75ad4fe4057e34bea204ce1cfd
          test "$(gh api repos/$GITHUB_REPOSITORY/actions/runs/38738002276 --jq .conclusion)" = success
          git diff --exit-code 328dc2e1caf84d75ad4fe4057e34bea204ce1cfd HEAD -- app shared sharedUi gradle scripts build.gradle.kts settings.gradle.kts gradle.properties
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: actions/download-artifact@v4
        with:
          name: space-final-signed
          path: dist
          github-token: ${{ github.token }}
          run-id: '38738002276'
      - name: Verify exact reviewed application bytes
        run: echo 'a3e71c2f2404a08acbde34e99d8914931b7f81607aa86fe30d1cd5c171f690fb  dist/Space-Music-1.0.1-beta.apk' | sha256sum -c -
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Capture library and fully rendered settings
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          cores: 2
          ram-size: 2048M
          heap-size: 512M
          emulator-boot-timeout: 300
          emulator-options: -no-window -gpu swangle -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none -feature -Vulkan -skin ${{ matrix.screen }} -dpi-device 160
          disable-animations: true
          script: bash docs/releases/1.0.1/test-visual-layout.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: space-visual-device-${{ matrix.api }}-${{ github.run_attempt }}
          path: |
            device-*.png
            device-full-log.txt
            device-crash-log.txt
            device-upgrade-ui.xml
