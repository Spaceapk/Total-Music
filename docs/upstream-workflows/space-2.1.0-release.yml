name: Verify signed Space Music 2.1.0 navigation, update and compatibility
# Wait for actual dialog acknowledgement before cold-start persistence assertions.
on:
  push:
    branches: [space-stable-publication]
    paths: ['.github/workflows/space-2.1.0-release.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: space-stable-release-2.1.0
  cancel-in-progress: true
jobs:
  sign:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERIFIED_RUN: '38907970488'
      VERIFIED_SHA: feee435adfcfa55a285ba605eae31d133b8f05cd
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require compiled and regression-checked source; signed device tests gate publication
        run: |
          set -euo pipefail
          test "$(gh api repos/$GITHUB_REPOSITORY/actions/runs/$VERIFIED_RUN --jq .head_sha)" = "$VERIFIED_SHA"
          test "$(gh api repos/$GITHUB_REPOSITORY/actions/runs/$VERIFIED_RUN/jobs --jq '.jobs[] | select(.name == "build") | .conclusion')" = success
          git diff --exit-code "$VERIFIED_SHA" HEAD -- app shared sharedUi gradle build.gradle.kts settings.gradle.kts gradle.properties
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install signature verification tools
        run: sdkmanager 'build-tools;36.0.0'
      - uses: actions/download-artifact@v4
        with:
          name: space-android-build
          path: built
          github-token: ${{ github.token }}
          run-id: '38907970488'
      - name: Restore locally signed APKs using public ZIP and signature metadata
        run: |
          set -euo pipefail
          mkdir -p dist
          apk=$(find built -path '*/prod/release/*' -name '*universal*unsigned.apk' | head -1)
          tests=$(find built -path '*/androidTest/prod/release/*' -name '*.apk' | head -1)
          gzip -dc docs/releases/2.1.0/app-signature.json.gz > /tmp/space-app-signature.json
          python3 docs/releases/1.0.1/restore-apk-signature.py restore "$apk" /tmp/space-app-signature.json dist/Space-Music-2.1.0.apk
          python3 docs/releases/1.0.1/restore-apk-signature.py restore "$tests" docs/releases/2.1.0/test-signature.json dist/test-runner.apk
          signer="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          "$signer" verify --verbose --print-certs dist/Space-Music-2.1.0.apk | tee dist/Space-Music-2.1.0.apk.signature.txt
          "$signer" verify --print-certs dist/test-runner.apk | tee dist/test-signature.txt
          grep -q '5436f4210119058a215c0b0660dead0a9b1bed315f13d6f801645c71c942c5ce' dist/Space-Music-2.1.0.apk.signature.txt
          grep -q '5436f4210119058a215c0b0660dead0a9b1bed315f13d6f801645c71c942c5ce' dist/test-signature.txt
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 4 dist/Space-Music-2.1.0.apk
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging dist/Space-Music-2.1.0.apk | head -1 | tee dist/package-verification.txt
          grep -q "name='org.nexlibre.spacemusic' versionCode='5'" dist/package-verification.txt
          (cd dist && sha256sum Space-Music-2.1.0.apk > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: space-2.1.0-signed
          path: dist/
  device:
    needs: sign
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 31
            screen: 360x800
          - api: 33
            screen: 360x800
          - api: 35
            screen: 412x892
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: actions/download-artifact@v4
        with:
          name: space-2.1.0-signed
          path: dist
      - name: Download previous published APK for update verification
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download v2.0.1-beta --repo "$GITHUB_REPOSITORY" --pattern '*.apk' --dir previous
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify signed update, playback and restored lyric panels
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          cores: 2
          ram-size: 2048M
          heap-size: 512M
          emulator-boot-timeout: 300
          emulator-options: -no-window -gpu swangle -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none -feature -Vulkan -skin ${{ matrix.screen }} -dpi-device 160
          disable-animations: true
          script: bash docs/releases/2.1.0/test-signed-update.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: space-2.1.0-device-${{ matrix.api }}-${{ github.run_attempt }}
          path: |
            device-tests.txt
            device-startup-log.txt
            device-crash-log.txt
            device-full-log.txt
            device-*.xml
            device-media-fixture.txt
            device-package-fixture.txt
            device-playlist-session.txt
            device-*.png

  publish:
    needs: [sign, device]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: space-2.1.0-signed
          path: dist
      - uses: actions/download-artifact@v4
        with:
          pattern: space-2.1.0-device-*
          path: verification
      - name: Require matching main and publish stable APK after all signed-device checks
        run: |
          set -euo pipefail
          test "$(gh api repos/$GITHUB_REPOSITORY/actions/runs/38907970488 --jq .conclusion)" = success
          git fetch origin main
          git diff --exit-code feee435adfcfa55a285ba605eae31d133b8f05cd origin/main -- app shared sharedUi gradle scripts build.gradle.kts settings.gradle.kts gradle.properties
          (cd dist && sha256sum -c SHA256SUMS.txt)
          cp docs/space-2.1.0-notes.md verification/
          (cd verification && zip -qr ../dist/Space-Music-2.1.0-verification.zip .)
          if gh release view v2.1.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Refusing to replace an existing release.'; exit 1
          fi
          gh release create v2.1.0 dist/Space-Music-2.1.0.apk dist/SHA256SUMS.txt dist/Space-Music-2.1.0.apk.signature.txt dist/Space-Music-2.1.0-verification.zip --repo "$GITHUB_REPOSITORY" --target feee435adfcfa55a285ba605eae31d133b8f05cd --title 'Space Music 2.1.0 · versión estable' --notes-file docs/space-2.1.0-notes.md --latest
