name: Publish reviewed Space Music 2.0.1 beta
on:
  push:
    branches: [space-2.0.1-publication]
    paths: ['.github/workflows/space-publish-2.0.1.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: publish-space-2.0.1
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      VERIFIED_RUN: '38806481333'
      VERIFIED_SHA: de730a72954cb1d602b1bec745e08d798bc05c9f
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require accepted signed update and matching main source
        run: |
          set -euo pipefail
          test "$(gh api repos/$GITHUB_REPOSITORY/actions/runs/$VERIFIED_RUN --jq .head_sha)" = "$VERIFIED_SHA"
          test "$(gh api repos/$GITHUB_REPOSITORY/actions/runs/$VERIFIED_RUN --jq .conclusion)" = success
          gh api repos/$GITHUB_REPOSITORY/actions/runs/$VERIFIED_RUN/jobs > signed-jobs.json
          python3 - <<'PY_JOBS'
          import json
          jobs=[j for j in json.load(open('signed-jobs.json'))['jobs'] if j['name'].startswith('device (')]
          assert len(jobs)==3 and all(j['conclusion']=='success' for j in jobs), jobs
          PY_JOBS
          git fetch origin main
          git diff --exit-code "$VERIFIED_SHA" HEAD -- app shared sharedUi gradle scripts build.gradle.kts settings.gradle.kts gradle.properties
          git diff --exit-code "$VERIFIED_SHA" origin/main -- app shared sharedUi gradle scripts build.gradle.kts settings.gradle.kts gradle.properties
          echo "RELEASE_TARGET=$(git rev-parse origin/main)" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          name: space-2.0.1-signed
          path: dist
          github-token: ${{ github.token }}
          run-id: '38806481333'
      - uses: actions/download-artifact@v4
        with:
          pattern: space-2.0.1-device-*
          path: verification
          github-token: ${{ github.token }}
          run-id: '38806481333'
      - name: Verify exact reviewed bytes and publish
        run: |
          set -euo pipefail
          echo '348e087ae9e023b0e15c4d4ad9b403baee695b85a8db06c8d0d0c6b1bbd1633b  dist/Space-Music-2.0.1-beta.apk' | sha256sum -c -
          (cd dist && sha256sum -c SHA256SUMS.txt)
          grep -q '5436f4210119058a215c0b0660dead0a9b1bed315f13d6f801645c71c942c5ce' dist/Space-Music-2.0.1-beta.apk.signature.txt
          grep -q "name='org.nexlibre.spacemusic' versionCode='4'" dist/package-verification.txt
          cp docs/verification-2.0.1.md verification/
          cp signed-jobs.json verification/
          (cd verification && zip -qr ../dist/Space-Music-2.0.1-verification.zip .)
          if gh release view v2.0.1-beta --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Refusing to replace an existing release.'; exit 1
          fi
          gh release create v2.0.1-beta dist/Space-Music-2.0.1-beta.apk dist/SHA256SUMS.txt dist/Space-Music-2.0.1-beta.apk.signature.txt dist/Space-Music-2.0.1-verification.zip --repo "$GITHUB_REPOSITORY" --target "$RELEASE_TARGET" --title 'Space Music 2.0.1 beta · navegación Liquid Glass' --notes-file docs/space-2.0.1-notes.md --prerelease
