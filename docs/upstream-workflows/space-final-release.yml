name: Verify signed Space Music final layout and themes before reviewed publication
on:
  push:
    branches: [space-reviewed-publication]
    paths: ['.github/workflows/space-final-release.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: space-final-release-1.0.1
  cancel-in-progress: true
jobs:
  sign:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERIFIED_RUN: '38735241735'
      VERIFIED_SHA: 981b0bb379954dcf5832f4e052ecc7e7581b5789
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require compiled and regression-checked source; signed device tests gate publication
        run: |
          set -euo pipefail
          test "$(gh api repos/$GITHUB_REPOSITORY/actions/runs/$VERIFIED_RUN --jq .head_sha)" = "$VERIFIED_SHA"
          test "$(gh api repos/$GITHUB_REPOSITORY/actions/runs/$VERIFIED_RUN --jq .conclusion)" = success
          git diff --exit-code "$VERIFIED_SHA" HEAD -- app shared sharedUi gradle scripts build.gradle.kts settings.gradle.kts gradle.properties
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install signature verification tools
        run: sdkmanager 'build-tools;36.0.0'
      - uses: actions/download-artifact@v4
        with:
          name: space-android-build
          path: built
          github-token: ${{ github.token }}
          run-id: '38735241735'
      - name: Restore locally signed APKs using public ZIP and signature metadata
        run: |
          set -euo pipefail
          mkdir -p dist
          apk=$(find built -path '*/prod/release/*' -name '*universal*unsigned.apk' | head -1)
          tests=$(find built -path '*/androidTest/prod/release/*' -name '*.apk' | head -1)
          python3 docs/releases/1.0.1/restore-apk-signature.py restore "$apk" docs/releases/1.0.1/app-signature.json dist/Space-Music-1.0.1-beta.apk
          python3 docs/releases/1.0.1/restore-apk-signature.py restore "$tests" docs/releases/1.0.1/test-signature.json dist/test-runner.apk
          signer="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          "$signer" verify --verbose --print-certs dist/Space-Music-1.0.1-beta.apk | tee dist/Space-Music-1.0.1-beta.apk.signature.txt
          "$signer" verify --print-certs dist/test-runner.apk | tee dist/test-signature.txt
          grep -q '5436f4210119058a215c0b0660dead0a9b1bed315f13d6f801645c71c942c5ce' dist/Space-Music-1.0.1-beta.apk.signature.txt
          grep -q '5436f4210119058a215c0b0660dead0a9b1bed315f13d6f801645c71c942c5ce' dist/test-signature.txt
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 4 dist/Space-Music-1.0.1-beta.apk
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging dist/Space-Music-1.0.1-beta.apk | head -1 | tee dist/package-verification.txt
          grep -q "name='org.nexlibre.spacemusic' versionCode='2'" dist/package-verification.txt
          (cd dist && sha256sum Space-Music-1.0.1-beta.apk > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: space-final-signed
          path: dist/
  device:
    needs: sign
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 26
            screen: 320x640
          - api: 33
            screen: 360x800
          - api: 35
            screen: 412x892
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: actions/download-artifact@v4
        with:
          name: space-final-signed
          path: dist
      - name: Download previous published APK for update verification
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download v1.0.0-beta --repo "$GITHUB_REPOSITORY" --pattern '*.apk' --dir previous
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install over the previous version and verify signed optimized playback
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          cores: 2
          ram-size: 2048M
          heap-size: 512M
          emulator-boot-timeout: 300
          emulator-options: -no-window -gpu swangle -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none -feature -Vulkan -skin ${{ matrix.screen }} -dpi-device 160
          disable-animations: true
          script: bash docs/releases/1.0.1/test-signed-update.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: space-final-device-${{ matrix.api }}-${{ github.run_attempt }}
          path: |
            device-tests.txt
            device-startup-log.txt
            device-crash-log.txt
            device-full-log.txt
            device-upgrade-ui.xml
            device-media-fixture.txt
            device-package-fixture.txt
            device-playlist-session.txt
            device-*.png
  publish:
    if: ${{ false }}
    needs: device
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: space-final-signed
          path: dist
      - name: Publish only after all signed Android tests succeed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v1.0.1-beta --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Release already exists; refusing to overwrite its APK.'
            exit 1
          fi
          printf '\nVerificación del APK firmado, actualización, listas y arrastre en Android 8/13/15: https://github.com/%s/actions/runs/%s\n' "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" >> docs/space-1.0.1-notes.md
          gh release create v1.0.1-beta dist/Space-Music-1.0.1-beta.apk dist/SHA256SUMS.txt dist/Space-Music-1.0.1-beta.apk.signature.txt --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title 'Space Music 1.0.1 beta · estabilidad y contraste' --notes-file docs/space-1.0.1-notes.md --prerelease
