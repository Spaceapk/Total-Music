name: Verify signed Space Music 2.0.1 navigation, update and compatibility
on:
  push:
    branches: [space-2.0.1-publication]
    paths: ['.github/workflows/space-2.0.1-release.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: space-lyrics-release-2.0.1
  cancel-in-progress: true
jobs:
  sign:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERIFIED_RUN: '38802903459'
      VERIFIED_SHA: 630ea70704eb06f8c6e1870a18a5d7af99d4234e
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require compiled and regression-checked source; signed device tests gate publication
        run: |
          set -euo pipefail
          test "$(gh api repos/$GITHUB_REPOSITORY/actions/runs/$VERIFIED_RUN --jq .head_sha)" = "$VERIFIED_SHA"
          # The original run built successfully; its new UI harness selected the
          # icon instead of its selectable parent. Signed devices below use the
          # corrected harness against these exact compiled APK bytes.
          test "$(gh api repos/$GITHUB_REPOSITORY/actions/runs/$VERIFIED_RUN/jobs --jq '.jobs[] | select(.name == "build") | .conclusion')" = success
          git diff --exit-code "$VERIFIED_SHA" HEAD -- app shared sharedUi gradle build.gradle.kts settings.gradle.kts gradle.properties
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install signature verification tools
        run: sdkmanager 'build-tools;36.0.0'
      - uses: actions/download-artifact@v4
        with:
          name: space-android-build
          path: built
          github-token: ${{ github.token }}
          run-id: '38802903459'
      - name: Restore locally signed APKs using public ZIP and signature metadata
        run: |
          set -euo pipefail
          mkdir -p dist
          apk=$(find built -path '*/prod/release/*' -name '*universal*unsigned.apk' | head -1)
          tests=$(find built -path '*/androidTest/prod/release/*' -name '*.apk' | head -1)
          gzip -dc docs/releases/2.0.1/app-signature.json.gz > /tmp/space-app-signature.json
          python3 docs/releases/1.0.1/restore-apk-signature.py restore "$apk" /tmp/space-app-signature.json dist/Space-Music-2.0.1-beta.apk
          python3 docs/releases/1.0.1/restore-apk-signature.py restore "$tests" docs/releases/2.0.1/test-signature.json dist/test-runner.apk
          signer="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          "$signer" verify --verbose --print-certs dist/Space-Music-2.0.1-beta.apk | tee dist/Space-Music-2.0.1-beta.apk.signature.txt
          "$signer" verify --print-certs dist/test-runner.apk | tee dist/test-signature.txt
          grep -q '5436f4210119058a215c0b0660dead0a9b1bed315f13d6f801645c71c942c5ce' dist/Space-Music-2.0.1-beta.apk.signature.txt
          grep -q '5436f4210119058a215c0b0660dead0a9b1bed315f13d6f801645c71c942c5ce' dist/test-signature.txt
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 4 dist/Space-Music-2.0.1-beta.apk
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging dist/Space-Music-2.0.1-beta.apk | head -1 | tee dist/package-verification.txt
          grep -q "name='org.nexlibre.spacemusic' versionCode='4'" dist/package-verification.txt
          (cd dist && sha256sum Space-Music-2.0.1-beta.apk > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: space-2.0.1-signed
          path: dist/
  device:
    needs: sign
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 31
            screen: 360x800
          - api: 33
            screen: 360x800
          - api: 35
            screen: 412x892
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: actions/download-artifact@v4
        with:
          name: space-2.0.1-signed
          path: dist
      - name: Download previous published APK for update verification
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download v1.0.2-beta --repo "$GITHUB_REPOSITORY" --pattern '*.apk' --dir previous
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify signed update, playback and restored lyric panels
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          cores: 2
          ram-size: 2048M
          heap-size: 512M
          emulator-boot-timeout: 300
          emulator-options: -no-window -gpu swangle -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none -feature -Vulkan -skin ${{ matrix.screen }} -dpi-device 160
          disable-animations: true
          script: bash docs/releases/2.0.1/test-signed-update.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: space-2.0.1-device-${{ matrix.api }}-${{ github.run_attempt }}
          path: |
            device-tests.txt
            device-startup-log.txt
            device-crash-log.txt
            device-full-log.txt
            device-*.xml
            device-media-fixture.txt
            device-package-fixture.txt
            device-playlist-session.txt
            device-*.png
