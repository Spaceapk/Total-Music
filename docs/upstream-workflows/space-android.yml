name: Space Music Android verification
on:
  push:
    branches: [space-local]
    paths-ignore: ['README.md', 'CHANGELOG.md', 'docs/**', '.signing/**']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: space-android-${{ github.ref }}
  cancel-in-progress: true
env:
  # Preserve manual verification of the old Space Music edition.
  ORG_GRADLE_PROJECT_spaceSpatialEdition: "false"
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android platform
        run: |
          sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0' 'cmake;3.22.1'
          if [ ! -d "$ANDROID_HOME/platforms/android-37" ]; then ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"; fi
      - name: Use installed Android NDK
        run: |
          set -euo pipefail
          ndk=$(find "$ANDROID_HOME/ndk" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          if [ -z "$ndk" ]; then
            sdkmanager 'ndk;27.0.12077973'
            ndk="$ANDROID_HOME/ndk/27.0.12077973"
          fi
          test -f "$ndk/source.properties"
          echo "ORG_GRADLE_PROJECT_spaceNdkVersion=${ndk##*/}" >> "$GITHUB_ENV"
          cat "$ndk/source.properties"
      - name: Regression tests
        run: |
          chmod +x gradlew
          ./gradlew '-Dorg.gradle.jvmargs=-Xmx6144m -Dfile.encoding=UTF-8 -Djava.net.preferIPv4Stack=true' --max-workers=2 :shared:jvmTest :app:testProdDebugUnitTest --build-cache --stacktrace
      - name: Android lint verification
        run: ./gradlew '-Dorg.gradle.jvmargs=-Xmx6144m -Dfile.encoding=UTF-8 -Djava.net.preferIPv4Stack=true' --max-workers=2 :app:lintProdDebug :app:lintVitalProdRelease --build-cache --stacktrace
      - name: Build debug and test APKs
        run: ./gradlew '-Dorg.gradle.jvmargs=-Xmx6144m -Dfile.encoding=UTF-8 -Djava.net.preferIPv4Stack=true' --max-workers=2 :app:assembleProdDebug :app:assembleProdDebugAndroidTest --build-cache --stacktrace
      - name: Build optimized release
        run: ./gradlew '-Dorg.gradle.jvmargs=-Xmx6144m -Dfile.encoding=UTF-8 -Djava.net.preferIPv4Stack=true' --max-workers=2 :app:assembleProdRelease --build-cache --stacktrace
      - name: Build instrumentation for the optimized release
        run: ./gradlew '-Dorg.gradle.jvmargs=-Xmx6144m -Dfile.encoding=UTF-8 -Djava.net.preferIPv4Stack=true' --max-workers=2 :app:assembleProdReleaseAndroidTest -PstarTestBuildType=release --build-cache --stacktrace
      - name: Export APK signing tool
        run: |
          mkdir -p signing-tools
          cp "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" signing-tools/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: space-android-build
          path: |
            app/build/outputs/apk/
            app/build/reports/
            shared/build/reports/tests/
            signing-tools/
          if-no-files-found: error
  device-test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: actions/download-artifact@v4
        with:
          name: space-android-build
          path: built
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify persistence and offline playback on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          cores: 4
          ram-size: 3072M
          heap-size: 512M
          emulator-boot-timeout: 300
          emulator-options: -no-window -gpu swangle -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none -feature -Vulkan
          disable-animations: true
          script: bash scripts/test-device.sh
      - name: Retain Android startup diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: space-device-test-diagnostics-${{ github.run_attempt }}
          path: |
            device-tests.txt
            device-startup-log.txt
            device-crash-log.txt
            device-*.png
            device-*.xml

  optimized-device-test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        api: [31, 33, 34, 35, 36]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: actions/download-artifact@v4
        with:
          name: space-android-build
          path: built
      - name: Sign optimized app and runner for isolated runtime verification
        run: |
          set -euo pipefail
          mkdir -p validation
          keydir=$(mktemp -d)
          trap 'rm -rf "$keydir"' EXIT
          keytool -genkeypair -keystore "$keydir/test.p12" -storetype PKCS12 -alias test-only -keyalg RSA -keysize 2048 -validity 2 -dname 'CN=Space CI only' -storepass space-test-only -keypass space-test-only
          apk=$(find built -path '*/prod/release/*' -name '*universal*unsigned.apk' | head -1)
          runner=$(find built -path '*/androidTest/prod/release/*' -name '*.apk' | head -1)
          signer=$(find built -name apksigner.jar | head -1)
          test -n "$apk"; test -n "$runner"; test -n "$signer"
          java -jar "$signer" sign --ks "$keydir/test.p12" --ks-key-alias test-only --ks-pass pass:space-test-only --key-pass pass:space-test-only --out validation/app.apk "$apk"
          java -jar "$signer" sign --ks "$keydir/test.p12" --ks-key-alias test-only --ks-pass pass:space-test-only --key-pass pass:space-test-only --out validation/runner.apk "$runner"
          java -jar "$signer" verify validation/app.apk
          java -jar "$signer" verify validation/runner.apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test actual optimized runtime offline
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          cores: 2
          ram-size: 2048M
          heap-size: 512M
          emulator-boot-timeout: 300
          emulator-options: -no-window -gpu swangle -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none -feature -Vulkan
          disable-animations: true
          script: TEST_APP_APK=validation/app.apk TEST_INSTRUMENTATION_APK=validation/runner.apk bash scripts/test-device.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: space-optimized-device-${{ matrix.api }}-${{ github.run_attempt }}
          path: |
            device-tests.txt
            device-startup-log.txt
            device-crash-log.txt
            device-full-log.txt
            device-*.xml
            device-*.png
